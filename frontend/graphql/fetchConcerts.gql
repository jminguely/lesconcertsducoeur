query getCalendar($sort: String, $locale: String, $where: JSON, $limit: Int, $start: Int) {
  calendarsConnection(locale: $locale, where: $where) {
    aggregate {
      count
    }
  }
  calendars(sort: $sort, locale: $locale, where: $where, limit: $limit, start: $start) {
    id
    canton {
      id
      abbreviation
    }
    date_time
    time_end
    title
    location
    details
    badge
    artists {
      id
      first_name
      last_name
      instrument
    }
    music_group {
      id
      name
      slug
      artists {
        id
        first_name
        last_name
        instrument
      }
    }
  }
}
